<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img">
  <defs>
    <style>
      .display { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; }
      .body { font-family: "Segoe UI", Arial, sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="42%" stop-color="#10151c"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glowL" cx="8%" cy="0%" r="58%">
      <stop offset="0%" stop-color="#7a9bb8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#7a9bb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="92%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#7a9bb8" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#7a9bb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a9bb8" stop-opacity="0"/>
      <stop offset="18%" stop-color="#7a9bb8" stop-opacity="0.5"/>
      <stop offset="82%" stop-color="#7a9bb8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7a9bb8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="noise" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="0.7" fill="#fff" opacity="0.045"/>
      <circle cx="48" cy="42" r="0.6" fill="#fff" opacity="0.035"/>
      <circle cx="86" cy="22" r="0.8" fill="#fff" opacity="0.04"/>
      <circle cx="110" cy="70" r="0.55" fill="#fff" opacity="0.03"/>
      <circle cx="30" cy="96" r="0.7" fill="#fff" opacity="0.04"/>
      <circle cx="72" cy="112" r="0.6" fill="#fff" opacity="0.035"/>
      <circle cx="128" cy="38" r="0.65" fill="#fff" opacity="0.04"/>
      <circle cx="18" cy="128" r="0.5" fill="#fff" opacity="0.03"/>
      <circle cx="98" cy="98" r="0.7" fill="#fff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>
  <rect width="1280" height="520" fill="url(#glowL)"/>
  <rect width="1280" height="520" fill="url(#glowR)"/>
  <rect width="1280" height="520" fill="url(#noise)" opacity="0.9"/>
  <circle cx="1080" cy="120" r="140" fill="#7a9bb8" opacity="0.05"/>

  <rect x="72" y="36" width="1136" height="1" fill="url(#hair)" opacity="0.7"/>

  <text x="80" y="120" class="display" font-size="18" fill="#7a9bb8" letter-spacing="3">PORTFOLIO 2026</text>
  <text x="76" y="210" class="display" font-size="78" fill="rgba(255,255,255,0.94)" letter-spacing="-2">Horacio Dominguez</text>
  <text x="80" y="268" class="body" font-size="28" font-weight="500" fill="rgba(255,255,255,0.9)">Desarrollador Web Full Stack</text>
  <text x="80" y="304" class="body" font-size="22" font-weight="400" fill="#7a9bb8">Full Stack Web Developer</text>
  <text x="80" y="360" class="body" font-size="17" fill="rgba(255,255,255,0.55)">ES - Mas de 20 anos creando soluciones digitales funcionales, accesibles y optimizadas.</text>
  <text x="80" y="388" class="body" font-size="17" fill="rgba(255,255,255,0.55)">EN - 20+ years building functional, accessible, optimized digital solutions.</text>

  <rect x="80" y="424" width="560" height="52" rx="10" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)"/>
  <text x="104" y="456" class="body" font-size="15" font-weight="600" fill="rgba(255,255,255,0.88)">horaciodominguez.com  |  WordPress / Woo  |  React / TypeScript</text>

  <rect x="72" y="500" width="1136" height="1" fill="url(#hair)" opacity="0.4"/>
