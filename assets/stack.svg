<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-labelledby="t">
  <title id="t">Stack</title>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap");
      .display { font-family: Syne, "Segoe UI", system-ui, sans-serif; font-weight: 700; }
      .body { font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
    </style>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="220" fill="#0b0d10"/>
  <text x="80" y="48" class="display" font-size="36" fill="rgba(255,255,255,0.92)">Stack</text>
  <text x="80" y="78" class="body" font-size="15" fill="rgba(255,255,255,0.55)">Base PHP/WordPress + capa moderna React/TypeScript</text>

  <rect x="80" y="104" width="540" height="88" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,0.1)"/>
  <text x="104" y="138" class="body" font-size="13" font-weight="600" fill="#7a9bb8" letter-spacing="1.5">CORE</text>
  <text x="104" y="168" class="body" font-size="16" fill="rgba(255,255,255,0.88)">PHP / MySQL / JavaScript / WordPress</text>
  <text x="104" y="192" class="body" font-size="16" fill="rgba(255,255,255,0.88)">WooCommerce / HTML5 / CSS3</text>

  <rect x="660" y="104" width="540" height="88" rx="12" fill="url(#glass)" stroke="rgba(255,255,255,0.1)"/>
  <text x="684" y="138" class="body" font-size="13" font-weight="600" fill="#7a9bb8" letter-spacing="1.5">MODERN</text>
  <text x="684" y="168" class="body" font-size="16" fill="rgba(255,255,255,0.88)">React / TypeScript / Next.js / Tailwind</text>
  <text x="684" y="192" class="body" font-size="16" fill="rgba(255,255,255,0.88)">Supabase / Vite / Docker</text>
</svg>
